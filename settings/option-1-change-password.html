<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Change Password — LDI Sales Dashboard</title>

<!-- 1) Load centralised host + anon key -->
<script src="../connect.js"></script>

<!-- 2) Turn HOSTNAME into CSS variables + expose it for later scripts -->
<script>
(function(){
  var H = window.HOSTNAME;
  var r = document.documentElement.style;
  r.setProperty('--img-background', "url('" + H + "/storage/v1/object/public/image/background.png')");
  r.setProperty('--img-ldi1',       "url('" + H + "/storage/v1/object/public/image/ldi1.png')");
  r.setProperty('--img-logo',       "url('" + H + "/storage/v1/object/public/image/logo.gif')");
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================
   LDI Sales Dashboard — Brand Theme
   ============================================ */
:root{
  --royal:#1b1bb3;--royal-2:#2020c8;--royal-deep:#0d0d7a;
  --red:#e31e24;--red-dark:#b9161b;
  --amber:#f5a623;--sky:#2e9bd6;
  --surface:#ffffff;--bg:#f4f6fb;
  --text:#101425;--text-2:#4a5572;--muted:#8d97b0;
  --border:#e3e7f2;--border-strong:#cdd4e6;
  --shadow-sm:0 1px 3px rgba(16,20,37,.07);
  --shadow-md:0 6px 20px rgba(16,20,37,.09);
  --shadow-lg:0 16px 48px rgba(16,20,37,.16);
  --r-sm:8px;--r-md:12px;--r-lg:18px;
  --fast:150ms ease;--smooth:280ms cubic-bezier(.4,0,.2,1);

  /* fallbacks — overwritten by inline script above once connect.js loads */
  --img-background: url('');
  --img-ldi1: url('');
  --img-logo: url('');
}
*{box-sizing:border-box}
body{
  margin:0;font-family:'DM Sans',sans-serif;color:var(--text);
  background:var(--royal-deep);
  background-image:linear-gradient(180deg,rgba(27,27,179,.42) 0%,rgba(13,13,122,.72) 100%),var(--img-background);
  background-size:cover,cover;background-position:center;background-repeat:no-repeat;background-attachment:fixed,fixed;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
input,select{font-family:inherit}
.num{font-variant-numeric:tabular-nums}

/* ---------- Buttons ---------- */
.button{border:0;border-radius:var(--r-sm);padding:10px 16px;font:600 13px/1 'DM Sans',sans-serif;cursor:pointer;transition:transform var(--fast),box-shadow var(--fast),background var(--fast);display:inline-flex;align-items:center;gap:6px}
.button.primary{background:linear-gradient(135deg,var(--royal-2),var(--royal));color:#fff;box-shadow:0 2px 8px rgba(27,27,179,.35)}
.button.primary:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(27,27,179,.45)}
.button.primary:active{transform:translateY(0)}
.button.secondary{background:rgba(255,255,255,.14);color:#e8ecff;border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px)}
.button.secondary:hover{background:rgba(255,255,255,.24);color:#fff}
.button.danger{background:var(--red);color:#fff}
.button.danger:hover{background:var(--red-dark)}
.button.small{padding:6px 12px;font-size:12px;border-radius:7px}

/* ---------- Topbar ---------- */
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:50;min-height:68px;
  background-image:linear-gradient(90deg,rgba(13,13,122,.88) 0%,rgba(27,27,179,.78) 45%,rgba(13,13,122,.88) 100%),var(--img-ldi1);
  background-size:cover;background-position:center;
  border-bottom:3px solid var(--amber);
  box-shadow:0 4px 18px rgba(13,13,122,.45);
  padding:10px 22px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
  backdrop-filter:blur(8px);
}
.brand{display:flex;align-items:center;gap:12px}
.nav-logo{height:40px;width:auto;border-radius:8px;background:#fff;padding:3px 6px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.brand strong{display:block;font-family:'Space Grotesk',sans-serif;font-size:15px;letter-spacing:-.3px;color:#fff}
.brand small{display:block;color:#cfd6ff;font-size:11px;margin-top:1px}
.nav-links{display:flex;gap:6px;flex-wrap:wrap}
.nav-company{
  background:rgba(255,255,255,.12);color:#e8ecff;border:1px solid rgba(255,255,255,.22);
  border-radius:20px;padding:8px 15px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all var(--fast);
  backdrop-filter:blur(4px);
}
.nav-company:hover{background:rgba(255,255,255,.24);color:#fff}
.nav-company.active{background:var(--amber);border-color:var(--amber);color:#3a2703;box-shadow:0 2px 10px rgba(245,166,35,.4)}
.header-actions{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
.user-info{font-size:12px;color:#e8ecff;padding:7px 13px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:20px;backdrop-filter:blur(4px)}

/* ---------- Layout ---------- */
.content{flex:1;max-width:1440px;margin:0 auto;padding:28px 22px 40px;width:100%}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:1.6px;color:var(--amber);margin:0 0 8px;text-transform:uppercase}

/* ---------- Hero ---------- */
.hero{margin-bottom:26px}
.hero-copy{
  background:var(--surface);
  background-image:linear-gradient(135deg,rgba(13,13,122,.82),rgba(27,27,179,.78)),var(--img-ldi1);
  background-size:cover,cover;background-position:center,center;background-repeat:no-repeat,repeat;
  border-radius:var(--r-lg);padding:30px 34px;box-shadow:var(--shadow-md);
  border-left:6px solid var(--amber);position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;
}
.hero-copy::after{content:'';position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(245,166,35,.12),transparent 70%)}
.hero-text{flex:1;min-width:260px}
.hero h1{font-family:'Space Grotesk',sans-serif;font-size:30px;margin:0 0 18px;color:#fff;letter-spacing:-.5px;text-shadow:0 2px 8px rgba(0,0,0,.25)}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;flex-shrink:0;margin:0}
.monitoring-hero-button{
  background:#fff;color:var(--royal);border:1.5px solid var(--royal);border-radius:22px;
  padding:11px 22px;font-size:13.5px;font-weight:600;cursor:pointer;transition:all var(--smooth);
}
.monitoring-hero-button:hover{background:var(--royal);color:#fff;transform:translateY(-2px);box-shadow:0 8px 20px rgba(27,27,179,.3)}
.monitoring-hero-button.active{background:var(--royal);color:#fff;box-shadow:0 4px 14px rgba(27,27,179,.35)}
.monitoring-hero-button.active:hover{background:var(--royal-deep)}
.monitoring-hero-button span{font-size:12px}

.workspace-heading{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;gap:14px;flex-wrap:wrap}
.workspace-heading h2{font-size:21px;color:#fff;margin:0;font-family:'Space Grotesk',sans-serif;letter-spacing:-.3px}
.import-note{font-size:13px;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:8px 16px;border-radius:20px;backdrop-filter:blur(4px)}

/* ---------- Empty state ---------- */
.empty{text-align:center;padding:70px 20px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-md)}
.empty-icon{font-size:44px;margin-bottom:10px}
.empty h2{font-size:24px;margin:0 0 10px}
.empty p{color:var(--text-2);margin:0 0 22px}

/* ---------- Stat cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:22px}
.card{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow-sm);border:1px solid var(--border);transition:box-shadow var(--smooth),transform var(--smooth)}
.card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.stat-card{padding:20px 22px}
.stat-label{font-size:11.5px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.stat-value{font-size:23px;font-weight:700;color:var(--text);font-family:'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums}
.stat-card:nth-child(1){border-top:3px solid var(--royal)}
.stat-card:nth-child(2){border-top:3px solid var(--sky)}
.stat-card:nth-child(3){border-top:3px solid var(--red)}
.stat-card:nth-child(4){border-top:3px solid var(--amber)}

/* ---------- Filters ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;padding:16px 18px;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow-sm);border:1px solid var(--border);align-items:center}
.filter-label{font-size:10.5px;font-weight:700;letter-spacing:1.2px;color:var(--royal);align-self:center}
.filters select,.filters input{
  padding:9px 12px;border:1px solid var(--border-strong);border-radius:var(--r-sm);font-size:13px;
  min-width:130px;background:#fff;color:var(--text);transition:border var(--fast),box-shadow var(--fast);outline:none;
}
.filters select:focus,.filters input:focus{border-color:var(--royal);box-shadow:0 0 0 3px rgba(27,27,179,.14)}
.filters input{min-width:150px}

/* ---------- Panel cards ---------- */
.chart-card,.monitor-card{padding:22px 24px;margin-bottom:22px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:14px;flex-wrap:wrap}
.card-head h2{font-size:17px;margin:0;font-family:'Space Grotesk',sans-serif;letter-spacing:-.2px}
.monitor-controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.monitor-controls label{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:6px;font-weight:600}
.monitor-controls select{padding:7px 10px;border:1px solid var(--border-strong);border-radius:7px;font-size:12.5px;background:#fff;color:var(--text);outline:none}
.monitor-controls select:focus{border-color:var(--royal);box-shadow:0 0 0 3px rgba(27,27,179,.14)}

/* ---------- Bar chart ---------- */
.chart{margin-top:8px}
.bar-chart{display:flex;align-items:flex-end;gap:10px;height:260px;padding:18px 6px 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;min-width:0}
.bar-value{font-size:10px;font-weight:700;color:var(--text-2);margin-bottom:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar-track{flex:1;width:100%;max-width:56px;background:#eef1f8;border-radius:8px 8px 0 0;display:flex;align-items:flex-end;min-height:4px;overflow:hidden}
.bar-fill{width:100%;background:linear-gradient(180deg,var(--royal-2),var(--royal-deep));border-radius:8px 8px 0 0;transition:height var(--smooth)}
.bar-col:hover .bar-fill{background:linear-gradient(180deg,var(--sky),var(--royal-2))}
.bar-label{font-size:11px;color:var(--muted);margin-top:8px;font-weight:600}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-sm)}
.monitor-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:900px}
.monitor-table th,.monitor-table td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
.monitor-table thead th{
  background:linear-gradient(135deg,var(--royal-2),var(--royal));color:#fff;font-weight:600;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.6px;position:sticky;top:0;
}
.monitor-table tbody tr:nth-child(even){background:#f7f9fd}
.monitor-table tbody tr:hover{background:#eef2ff}
.monitor-table td.right,.monitor-table th.right{text-align:right;font-variant-numeric:tabular-nums}
.total-cell{font-weight:700;color:var(--royal-deep);background:#e8edff}
.name-cell{max-width:220px;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--text)}
footer{text-align:center;padding:26px;color:rgba(255,255,255,.75);font-size:12px}

/* ---------- Line chart ---------- */
.trend-svg{width:100%;height:auto;display:block}
.trend-grid{stroke:#e3e7f2;stroke-width:1}
.trend-line{fill:none;stroke:var(--royal);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.trend-area{fill:url(#trendFill);opacity:.85}
.trend-dot{fill:#fff;stroke:var(--royal);stroke-width:2.5;transition:r var(--fast)}
.trend-dot:hover{r:6;fill:var(--amber);stroke:var(--royal-deep)}
.trend-label{font-size:11px;fill:var(--muted);font-family:'DM Sans',sans-serif}
.trend-value{font-size:11px;font-weight:700;fill:var(--text);font-family:'DM Sans',sans-serif}
.trend-tip{opacity:0;transition:opacity var(--fast);pointer-events:none}
.trend-dot:hover + .trend-tip,.trend-pt:hover ~ .trend-tip{opacity:1}
.legend{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--text-2)}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

/* ---------- Login page ---------- */
.login-page{display:block}
.login-shell{min-height:100vh;display:grid;grid-template-columns:minmax(380px,46%) 1fr}
.login-brand{
  position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background-image:linear-gradient(160deg,rgba(13,13,122,.86) 0%,rgba(27,27,179,.62) 55%,rgba(13,13,122,.9) 100%),var(--img-ldi1);
  background-size:cover;background-position:center;
}
.brand-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,13,122,.35),transparent 40%,rgba(13,13,122,.55))}
.brand-content{position:relative;z-index:2;text-align:center;padding:44px 36px;max-width:520px}
.brand-logo{height:84px;width:auto;background:#fff;border-radius:14px;padding:8px 14px;box-shadow:0 10px 30px rgba(0,0,0,.4);margin-bottom:26px}
.brand-title{font-family:'Space Grotesk',sans-serif;font-size:34px;color:#fff;margin:0 0 10px;letter-spacing:-.5px}
.brand-tag{font-size:17px;font-weight:700;color:var(--amber);margin:0 0 6px;letter-spacing:.3px}
.brand-sub{font-size:13px;color:#cfd6ff;margin:0}
.brand-chevron{position:absolute;left:0;right:0;bottom:0;height:70px;z-index:1;background:#fff;clip-path:polygon(0 100%,100% 100%,50% 0);opacity:.95}
.login-main{display:flex;align-items:center;justify-content:center;padding:40px 24px;background:var(--bg)}
.login-card{background:#fff;border-radius:20px;box-shadow:var(--shadow-lg);border:1px solid var(--border);padding:38px 40px;width:100%;max-width:440px}
.form-head{text-align:center;margin-bottom:28px}
.form-logo{height:44px;width:auto;margin-bottom:14px}
.form-head h2{font-family:'Space Grotesk',sans-serif;font-size:22px;margin:0 0 6px;color:var(--text)}
.form-head p{color:var(--text-2);font-size:14px;margin:0}
.form-group{margin-bottom:18px;text-align:left}
.form-group label{display:block;font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:6px;letter-spacing:.2px}
.form-group input{width:100%;padding:12px 14px;border:1.5px solid var(--border-strong);border-radius:10px;font-size:14px;outline:none;transition:border var(--fast),box-shadow var(--fast);background:#fff;color:var(--text)}
.form-group input:focus{border-color:var(--royal);box-shadow:0 0 0 4px rgba(27,27,179,.12)}
.form-group input::placeholder{color:var(--muted)}
.btn-primary{width:100%;padding:13px;border:0;border-radius:11px;cursor:pointer;background:linear-gradient(135deg,var(--royal-2),var(--royal));color:#fff;font:700 15px 'DM Sans',sans-serif;letter-spacing:.2px;box-shadow:0 6px 18px rgba(27,27,179,.35);transition:transform var(--fast),box-shadow var(--fast),opacity var(--fast);display:flex;align-items:center;justify-content:center;gap:8px}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 10px 26px rgba(27,27,179,.45)}
.btn-primary:active:not(:disabled){transform:translateY(0)}
.btn-primary:disabled{opacity:.65;cursor:wait}
.btn-primary.loading .btn-label::after{content:'';display:inline-block;width:14px;height:14px;margin-left:8px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.auth-error{color:var(--red);font-size:13px;min-height:18px;margin:10px 0;text-align:center;font-weight:600}
.auth-success{text-align:center;padding:16px 0 8px}
.success-icon{width:56px;height:56px;border-radius:50%;background:#e8f8ee;color:#16a34a;font-size:26px;display:grid;place-items:center;margin:0 auto 14px;border:2px solid #b7e6c6}
.auth-success h3{margin:0 0 6px;color:var(--text);font-size:17px}
.auth-success p{margin:0;color:var(--text-2);font-size:13.5px}
.auth-footer{text-align:center;margin-top:22px;padding-top:18px;border-top:1px solid var(--border)}
.auth-footer p{font-size:13.5px;color:var(--text-2);margin:0}
.link-button{background:none;border:0;color:var(--royal);cursor:pointer;font:600 13.5px 'DM Sans',sans-serif;padding:0;text-decoration:none;transition:color var(--fast)}
.link-button:hover{color:var(--royal-deep);text-decoration:underline}

/* ---------- Admin panel ---------- */
.admin-overlay{position:fixed;inset:0;background:rgba(13,13,122,.55);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:44px 20px;overflow-y:auto;animation:fadeIn var(--smooth)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.admin-panel{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:640px;box-shadow:var(--shadow-lg);animation:slideUp var(--smooth)}
.admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid var(--royal)}
.admin-header h2{margin:0;font-size:19px;font-family:'Space Grotesk',sans-serif;color:var(--text)}
.admin-filters{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.admin-filters label{font-size:12.5px;font-weight:700;color:var(--text-2)}
.admin-filters select{padding:8px 12px;border:1px solid var(--border-strong);border-radius:8px;font-size:13px;background:#fff;color:var(--text);outline:none}
.admin-filters select:focus{border-color:var(--royal);box-shadow:0 0 0 3px rgba(27,27,179,.14)}
.admin-user-list{display:flex;flex-direction:column;gap:10px}
.admin-user-card{border:1px solid var(--border);border-radius:10px;padding:14px 16px;background:#fafbfe;transition:border var(--fast)}
.admin-user-card.status-pending{border-color:var(--amber);background:#fffaf0}
.admin-user-card.status-active{border-color:#7ed6a2;background:#f4fcf7}
.admin-user-card.status-rejected{border-color:var(--red);background:#fff5f5}
.admin-user-main{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.admin-user-main strong{font-size:14.5px;color:var(--text)}
.admin-user-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.badge{padding:4px 11px;border-radius:20px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.badge-pending{background:#fdeec8;color:#a16c07}
.badge-active{background:#d9f4e4;color:#0e7c3f}
.badge-rejected{background:#fde3e3;color:#b9161b}
.badge-role-superadmin{background:#e3e8ff;color:#1b1bb3}
.badge-role-company_admin{background:#e0f2fe;color:#0369a1}
.badge-role-sales_rep{background:#fef3e2;color:#b45309}
.badge-role-area_user{background:#ede9fe;color:#6d28d9}

/* ---------- Links styled as buttons ---------- */
a.button{text-decoration:none}
a.nav-company,a.monitoring-hero-button{text-decoration:none;display:inline-block}

/* ---------- Change password (centered) ---------- */
.content.pw-content{max-width:1440px;margin:0 auto;padding:40px 22px;display:flex;justify-content:center;align-items:flex-start}
.pw-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-md);padding:26px;max-width:440px;width:100%}
.pw-card h2{font-family:'Space Grotesk',sans-serif;font-size:20px;margin:0 0 4px}
.pw-card p.sub{color:var(--text-2);font-size:13px;margin:0 0 18px}
.pw-field{margin-bottom:14px}
.pw-field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px}
.pw-field input{width:100%;border:1.5px solid var(--border-strong);border-radius:var(--r-sm);padding:11px 44px 11px 13px;font-size:14px;outline:none;transition:border var(--fast),box-shadow var(--fast)}
.pw-field input:focus{border-color:var(--royal);box-shadow:0 0 0 3px rgba(27,27,179,.14)}
.pw-wrap{position:relative}
.pw-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:0;border-radius:7px;padding:6px 8px;font-size:16px;line-height:1;color:var(--text-2);cursor:pointer;transition:background var(--fast),color var(--fast)}
.pw-eye:hover{background:#eef1fb;color:var(--royal)}
.pw-msg{font-size:13px;font-weight:600;min-height:20px;margin:2px 0 12px}
.pw-msg.err{color:var(--red)}
.pw-msg.ok{color:#0a7a3d}

/* ---------- Responsive ---------- */
@media(max-width:900px){
  .content.pw-content{padding:28px 14px}
  .login-shell{grid-template-columns:1fr}
  .login-brand{min-height:230px}
  .brand-content{padding:30px 22px}
  .brand-logo{height:60px;margin-bottom:14px}
  .brand-title{font-size:24px}
  .brand-tag{font-size:14px}
  .brand-chevron{display:none}
  .hero h1{font-size:23px}
  .bar-chart{height:190px}
  .filters{flex-direction:column;align-items:stretch}
  .filters select,.filters input{width:100%}

}
@media(max-width:560px){
  .content{padding:18px 14px 30px}
  .topbar{padding:10px 14px}
  .header-actions{width:100%}
  .cards{grid-template-columns:1fr}
  .login-card{padding:26px 22px}
  .stat-value{font-size:19px}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand">
    <!-- src set from HOSTNAME via data-img -->
    <img data-img="logo.gif" alt="LDI" class="nav-logo">
  </div>
  <a class="button secondary" href="../dashboard.html">&#8592; Back</a>
</header>
<main class="content pw-content">
  <div class="pw-card">
        <h2>Change Password</h2>
        <p class="sub">Enter your current password, then choose a new one.</p>
        <div class="pw-field">
          <label for="pw-current">Current password</label>
          <div class="pw-wrap">
            <input id="pw-current" type="password" autocomplete="current-password" placeholder="••••••••">
            <button class="pw-eye" type="button" data-eye="pw-current" title="Show password" aria-label="Show password">&#128065;</button>
          </div>
        </div>
        <div class="pw-field">
          <label for="pw-new">New password</label>
          <div class="pw-wrap">
            <input id="pw-new" type="password" autocomplete="new-password" placeholder="Min. 6 characters">
            <button class="pw-eye" type="button" data-eye="pw-new" title="Show password" aria-label="Show password">&#128065;</button>
          </div>
        </div>
        <div class="pw-field">
          <label for="pw-confirm">Confirm new password</label>
          <div class="pw-wrap">
            <input id="pw-confirm" type="password" autocomplete="new-password" placeholder="Repeat new password">
            <button class="pw-eye" type="button" data-eye="pw-confirm" title="Show password" aria-label="Show password">&#128065;</button>
          </div>
        </div>
        <p class="pw-msg" id="pw-msg"></p>
        <button class="button primary" id="pw-save" type="button">Save new password</button>
        <button class="button" type="button" onclick="location.href='../dashboard.html'" style="margin-left:8px;background:#eef1f8;color:#4a5572;border:1px solid #cdd4e6">Cancel</button>
  </div>
</main>
</div>

<!-- Resolve data-img placeholders using HOSTNAME -->
<script>
document.querySelectorAll('[data-img]').forEach(function(el){
  el.src = window.HOSTNAME + '/storage/v1/object/public/image/' + el.dataset.img;
});
</script>

<script>
(async () => {
/* ===== inlined supabase client — now uses window.HOSTNAME / window.ANON_KEY ===== */
const SUPABASE_URL      = window.HOSTNAME;
const SUPABASE_ANON_KEY = window.ANON_KEY;

class QB{constructor(t){this.t=t;this.url=SUPABASE_URL+'/rest/v1/'+t;this.p=[];this.m='GET';this.b=null;this.rr=false}select(f='*'){this.p.push('select='+encodeURIComponent(f));return this}eq(f,v){this.p.push(f+'=eq.'+encodeURIComponent(v));return this}neq(f,v){this.p.push(f+'=not.'+encodeURIComponent(v));return this}gt(f,v){this.p.push(f+'=gt.'+encodeURIComponent(v));return this}lt(f,v){this.p.push(f+'=lt.'+encodeURIComponent(v));return this}gte(f,v){this.p.push(f+'=gte.'+encodeURIComponent(v));return this}lte(f,v){this.p.push(f+'=lte.'+encodeURIComponent(v));return this}like(f,v){this.p.push(f+'=like.'+encodeURIComponent(v));return this}ilike(f,v){this.p.push(f+'=ilike.'+encodeURIComponent(v));return this}in(f,vs){this.p.push(f+'=in.('+vs.map(encodeURIComponent).join(',')+')');return this}order(f,o={}){this.p.push('order='+f+'.'+(o.ascending===false?'desc':'asc'));return this}limit(n){this.p.push('limit='+n);return this}offset(n){this.p.push('offset='+n);return this}_url(){return this.p.length?this.url+'?'+this.p.join('&'):this.url}_h(e={}){const h={apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+SUPABASE_ANON_KEY,...e};if(this.rr)h.Prefer='return=representation';return h}
  _build(){const i={method:this.m,headers:this._h()};if(this.b)i.body=JSON.stringify(this.b);return i}
  async _run(){const r=await fetch(this._url(),this._build());if(!r.ok){const t=await r.text();throw new Error('API Error: '+t)}const t=await r.text();return t?JSON.parse(t):[]}
  then(onF,onR){return this._run().then(onF,onR)}
  catch(onR){return this._run().catch(onR)}
  async single(){this.p.push('limit=1');const r=await this._run();return r&&r.length?r[0]:null}
  async insert(rows){this.m='POST';this.b=Array.isArray(rows)?rows:[rows];this.rr=true;return await this._run()}
  async update(changes){this.m='PATCH';this.b=changes;this.rr=true;return await this._run()}
  async delete(){this.m='DELETE';this.rr=true;return await this._run()}}

const supabase={from(t){return new QB(t)},auth:{currentUser:null,session:null,async signInWithPassword({email,password}){try{const u=await supabase.from('users').select('*').eq('username',email).single();if(!u)return{data:null,error:{message:'User not found'}};if(u.password!==password)return{data:null,error:{message:'Wrong password'}};if(u.status==='pending')return{data:null,error:{message:'Account pending admin approval'}};if(u.status==='rejected')return{data:null,error:{message:'Account rejected'}};supabase.auth.currentUser=u;supabase.auth.session={user:u};try{sessionStorage.setItem('ldi_session',JSON.stringify(u))}catch(e){}return{data:{user:u,session:supabase.auth.session},error:null}}catch(e){console.error('Login error:',e);return{data:null,error:{message:e.message||'Login failed'}}}},async signUp({email,password}){try{const ex=await supabase.from('users').select('id').eq('username',email).single();if(ex)return{data:null,error:{message:'Username already exists'}};const c=await supabase.from('users').insert({username:email,password,role:'sales_rep',status:'pending',assigned_companies:[],assigned_sales_rep_codes:[],assigned_areas:[]});const user=Array.isArray(c)?c[0]:c;return{data:{user},error:null}}catch(e){console.error('SignUp error:',e);return{data:null,error:{message:e.message||'Sign up failed'}}}},async signOut(){supabase.auth.currentUser=null;supabase.auth.session=null;try{sessionStorage.removeItem('ldi_session')}catch(e){}return{error:null}},async getSession(){try{const raw=sessionStorage.getItem('ldi_session');if(raw){const u=JSON.parse(raw);supabase.auth.currentUser=u;supabase.auth.session={user:u}}}catch(e){}return{data:{session:supabase.auth.session},error:null}}},async init(){}}

/* ===== auth guard ===== */
await supabase.init()
const session = await supabase.auth.getSession()
if (!session?.data?.session?.user) {
  location.replace('../index.html')
}
window._supabase = supabase
window._SUPABASE_URL = SUPABASE_URL
window._SUPABASE_ANON_KEY = SUPABASE_ANON_KEY
})()
</script>

<script>
/* ===== change password page: eyes + save ===== */
(function(){
  document.querySelectorAll('.pw-eye').forEach((eye)=>{
    eye.addEventListener('click',()=>{
      const input=document.getElementById(eye.getAttribute('data-eye'))
      if(!input){return}
      const show=input.type==='password'
      input.type=show?'text':'password'
      eye.innerHTML=show?'&#128064;':'&#128065;'
      eye.title=show?'Hide password':'Show password'
      eye.setAttribute('aria-label',show?'Hide password':'Show password')
    })
  })

  const saveBtn=document.getElementById('pw-save')
  if(saveBtn){
    saveBtn.addEventListener('click',async ()=>{
      const msg=document.getElementById('pw-msg')
      const cur=document.getElementById('pw-current').value
      const nw=document.getElementById('pw-new').value
      const cf=document.getElementById('pw-confirm').value
      const say=(t,ok)=>{if(msg){msg.textContent=t;msg.className='pw-msg '+(ok?'ok':'err')}}
      say('',true)
      if(!cur||!nw||!cf){say('Please fill in all three fields.');return}
      if(nw.length<6){say('New password must be at least 6 characters.');return}
      if(nw!==cf){say('New passwords do not match.');return}
      saveBtn.disabled=true;saveBtn.textContent='Saving…'
      try{
        const sb=window._supabase
        const hash=async plain=>{
          const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(plain))
          return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('')
        }
        const curHash=await hash(cur)
        const nwHash=await hash(nw)
        let me=null
        try{me=JSON.parse(sessionStorage.getItem('ldi_session')||'null')}catch(e){}
        if(!me||!me.username){say('Session expired. Please log in again.');location.replace('../index.html');return}
        const rec=await sb.from('users').select('id,password').eq('username',me.username).single()
        if(!rec){say('Account not found.');return}
        if(rec.password!==curHash&&rec.password!==cur){say('Current password is incorrect.');return}
        const patchUrl=window._SUPABASE_URL+'/rest/v1/users?id=eq.'+encodeURIComponent(rec.id)
        const patchRes=await fetch(patchUrl,{method:'PATCH',headers:{apikey:window._SUPABASE_ANON_KEY,Authorization:'Bearer '+window._SUPABASE_ANON_KEY,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({password:nwHash})})
        if(!patchRes.ok){throw new Error('API Error: '+await patchRes.text())}
        me.password=nwHash
        try{sessionStorage.setItem('ldi_session',JSON.stringify(me))}catch(e){}
        document.getElementById('pw-current').value=''
        document.getElementById('pw-new').value=''
        document.getElementById('pw-confirm').value=''
        say('Password updated successfully.',true)
      }catch(err){
        say('Failed to update password: '+(err.message||err))
      }finally{
        saveBtn.disabled=false;saveBtn.textContent='Save new password'
      }
    })
  }
})()
</script>
</body>
