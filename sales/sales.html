<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d7a">
  <meta name="format-detection" content="telephone=no">
  <title>Sales — Lakpue Drug Inc</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --royal: #1b1bb3; --royal-2: #2020c8; --royal-deep: #0d0d7a;
      --red: #e31e24; --red-dark: #b9161b;
      --amber: #f5a623; --sky: #2e9bd6;
      --surface: #ffffff; --bg: #f4f6fb;
      --text: #101425; --text-2: #4a5572; --muted: #8d97b0;
      --border: #e3e7f2; --border-strong: #cdd4e6;
      --shadow-sm: 0 1px 3px rgba(16,20,37,.07);
      --shadow-md: 0 6px 20px rgba(16,20,37,.09);
      --shadow-lg: 0 16px 48px rgba(16,20,37,.16);
      --r-sm: 8px; --r-md: 12px; --r-lg: 18px;
      --fast: 150ms ease; --smooth: 280ms cubic-bezier(.4,0,.2,1);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --content-max: 1440px;
      --inner-max: 1180px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    html {
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      scroll-behavior: smooth;
      overflow-x: hidden;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: clamp(13px, .35vw + 12px, 15px);
      color: var(--text);
      background: var(--royal-deep);
      background-image: linear-gradient(180deg, rgba(27,27,179,.42) 0%, rgba(13,13,122,.72) 100%), url('https://trainers-police-rome-amplifier.trycloudflare.com/storage/v1/object/public/image/background.png');
      background-size: cover, cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed, fixed;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      min-height: 100dvh;
      overflow-x: hidden;
      touch-action: manipulation;
      overscroll-behavior-y: none;
    }

    button, input, select, textarea {
      font-family: inherit;
      -webkit-appearance: none;
      appearance: none;
    }

    .app {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      min-height: 100dvh;
      display: flex; flex-direction: column;
    }

    .content {
      flex: 1; width: 100%;
      max-width: var(--content-max);
      margin: 0 auto;
      padding: calc(clamp(16px, 2.4vh, 28px) + var(--safe-top)) clamp(12px, 1.8vw, 24px) clamp(24px, 3vh, 44px);
      padding-left: calc(clamp(12px, 1.8vw, 24px) + var(--safe-left));
      padding-right: calc(clamp(12px, 1.8vw, 24px) + var(--safe-right));
    }
    .content.sales-content { max-width: none; margin: 0; padding: 0; width: 100%; }

    .layout {
      display: flex; align-items: stretch;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
    }

    .main-col {
      flex: 1 1 auto; min-width: 0;
      padding: calc(clamp(16px, 2.4vh, 26px) + var(--safe-top)) clamp(12px, 1.6vw, 24px) clamp(24px, 3vh, 44px);
      padding-left: calc(clamp(12px, 1.6vw, 24px) + var(--safe-left));
      padding-right: calc(clamp(12px, 1.6vw, 24px) + var(--safe-right));
      padding-bottom: calc(clamp(24px, 3vh, 44px) + var(--safe-bottom));
    }
    .main-col-inner {
      width: 100%;
      max-width: var(--inner-max);
      min-width: 0;
      margin: 0 auto;
    }

    .hero {
      position: relative; color: #fff;
      padding: clamp(14px, 2.4vh, 22px) clamp(14px, 2vw, 26px);
      border-radius: var(--r-lg);
      background-image: linear-gradient(115deg, rgba(13,13,122,.95) 0%, rgba(27,27,179,.86) 48%, rgba(227,30,36,.60) 100%), url('https://trainers-police-rome-amplifier.trycloudflare.com/storage/v1/object/public/image/ldi1.png');
      background-size: cover; background-position: center;
      border-bottom: 3px solid var(--amber);
      border-left: 3px solid var(--amber);
      border-right: 3px solid var(--amber);
      box-shadow: var(--shadow-md);
      margin-bottom: clamp(10px, 1.6vh, 16px);
      display: flex; flex-direction: column;
      gap: clamp(10px, 1.8vh, 18px);
    }
    .hero::after {
      content: ''; position: absolute; inset: 0; border-radius: inherit;
      pointer-events: none;
      background: radial-gradient(120% 150% at 100% 0%, rgba(255,255,255,.18), transparent 55%);
    }
    .hero-top {
      position: relative; z-index: 1;
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: clamp(10px, 1.4vw, 18px); flex-wrap: wrap;
    }
    .hero-text { min-width: 0; flex: 1 1 240px; }
    .hero-eyebrow {
      margin: 0 0 5px;
      font-size: clamp(9px, .3vw + 8px, 11px);
      letter-spacing: 1.6px;
      text-transform: uppercase; color: #ffd98a; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .hero-title {
      margin: 0; font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(18px, 1.4vw + 14px, 26px);
      letter-spacing: -.5px; line-height: 1.15;
      color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.25);
    }

    .fm-dropzone {
      position: relative;
      min-height: clamp(280px, 45vh, 480px);
      background: var(--surface); border-radius: var(--r-md);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: clamp(10px, 1.4vw, 18px);
      transition: border-color var(--fast), background var(--fast);
    }

    @media (max-width: 1100px) {
      :root { --inner-max: 1000px; }
      .hero-title { font-size: clamp(17px, 1.3vw + 12px, 21px); }
    }

    @media (max-width: 820px) {
      :root { --content-max: 100%; --inner-max: 100%; }
    }

    @media (max-width: 640px) {
      .hero {
        padding: 14px 14px;
        border-radius: 14px;
        gap: 12px;
      }
      .hero-top { flex-direction: column; gap: 10px; }
      .hero-title { font-size: 18px; }
    }

    @media (max-width: 400px) {
      .hero-title { font-size: 16px; }
      .hero-eyebrow { font-size: 9px; }
    }

    @media (max-width: 340px) {
      .hero-title { font-size: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
<div class="app">
  <main class="content sales-content">
    <div class="layout" id="art-layout">
      <div class="main-col">
        <div class="main-col-inner">
          <section class="hero">
            <div class="hero-top">
              <div class="hero-text">
                <p class="hero-eyebrow" id="hero-eyebrow">LAKPUE DRUG INC</p>
                <h1 class="hero-title" id="hero-title">Files</h1>
              </div>
              <!-- no storage, no buttons -->
            </div>
          </section>

          <div id="files-view">
            <div class="fm-dropzone" id="fm-dropzone">
              <!-- completely empty drop zone -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
